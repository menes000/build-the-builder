<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#16140f"/><stop offset="1" stop-color="#2a1a10"/></linearGradient>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#fb651e"/></marker>
    <marker id="w" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#ffffff" fill-opacity=".6"/></marker>
  </defs>
  <rect width="1200" height="300" rx="20" fill="url(#bg)"/>

  <!-- TEMPLATE lane -->
  <text x="40" y="50" font-size="12" fill="#fb651e" letter-spacing="2.5" font-weight="700">TEMPLATE MODE · A CALL TYPE THE BUILDER KNOWS</text>
  <g>
    <rect x="40" y="66" width="250" height="70" rx="10" fill="#16140f" stroke="#ffffff" stroke-opacity=".25"/>
    <text x="58" y="94" font-size="15" font-weight="700" fill="#fff">1 · EXTRACT</text>
    <text x="58" y="116" font-size="12" fill="#fff" fill-opacity=".65">Claude fills the CallSpec form</text>
    <path d="M290 101 H318" stroke="#fff" stroke-opacity=".6" stroke-width="2" marker-end="url(#w)"/>

    <rect x="322" y="66" width="250" height="70" rx="10" fill="#16140f" stroke="#ffffff" stroke-opacity=".25"/>
    <text x="340" y="94" font-size="15" font-weight="700" fill="#fff">2 · COMPILE</text>
    <text x="340" y="116" font-size="12" fill="#fff" fill-opacity=".65">deterministic · dates &amp; sums in code</text>
    <path d="M572 101 H600" stroke="#fff" stroke-opacity=".6" stroke-width="2" marker-end="url(#w)"/>

    <rect x="604" y="66" width="250" height="70" rx="10" fill="#16140f" stroke="#ffffff" stroke-opacity=".25"/>
    <text x="622" y="94" font-size="15" font-weight="700" fill="#fff">3 · CHECK + PUBLISH</text>
    <text x="622" y="116" font-size="12" fill="#fff" fill-opacity=".65">lint · run snippets · dryRun</text>
    <path d="M854 101 H882" stroke="#fff" stroke-opacity=".6" stroke-width="2" marker-end="url(#w)"/>

    <rect x="886" y="66" width="274" height="70" rx="10" fill="#fb651e" fill-opacity=".15" stroke="#fb651e"/>
    <text x="904" y="94" font-size="15" font-weight="700" fill="#fff">4 · TEST + FIX</text>
    <text x="904" y="116" font-size="12" fill="#fff" fill-opacity=".75">practice customers → revise texts</text>
    <path d="M1023 136 C1023 160 480 160 456 140" stroke="#fb651e" stroke-width="1.8" stroke-dasharray="5 4" fill="none" marker-end="url(#a)"/>
    <text x="740" y="176" text-anchor="middle" font-size="11" fill="#fb651e">kept only if more customers pass</text>
  </g>

  <line x1="40" y1="182" x2="1160" y2="182" stroke="#ffffff" stroke-opacity=".08"/>

  <!-- FREE-FORM lane -->
  <text x="40" y="214" font-size="12" fill="#fb651e" letter-spacing="2.5" font-weight="700">FREE-FORM MODE · A CALL TYPE IT HAS NEVER SEEN</text>
  <g>
    <rect x="40" y="226" width="250" height="56" rx="10" fill="#16140f" stroke="#ffffff" stroke-opacity=".25"/>
    <text x="58" y="250" font-size="15" font-weight="700" fill="#fff">1 · CONTRACT → API</text>
    <text x="58" y="269" font-size="12" fill="#fff" fill-opacity=".65">OpenAPI from the bank's contract</text>
    <path d="M290 254 H318" stroke="#fff" stroke-opacity=".6" stroke-width="2" marker-end="url(#w)"/>

    <rect x="322" y="226" width="250" height="56" rx="10" fill="#16140f" stroke="#ffffff" stroke-opacity=".25"/>
    <text x="340" y="250" font-size="15" font-weight="700" fill="#fff">2 · DESIGN</text>
    <text x="340" y="269" font-size="12" fill="#fff" fill-opacity=".65">all sources · latest decision wins</text>
    <path d="M572 254 H600" stroke="#fff" stroke-opacity=".6" stroke-width="2" marker-end="url(#w)"/>

    <rect x="604" y="226" width="250" height="56" rx="10" fill="#16140f" stroke="#ffffff" stroke-opacity=".25"/>
    <text x="622" y="250" font-size="15" font-weight="700" fill="#fff">3 · WORKFLOW</text>
    <text x="622" y="269" font-size="12" fill="#fff" fill-opacity=".65">Claude writes the Freya JSON</text>
    <path d="M854 254 H882" stroke="#fff" stroke-opacity=".6" stroke-width="2" marker-end="url(#w)"/>

    <rect x="886" y="226" width="274" height="56" rx="10" fill="#fb651e" fill-opacity=".15" stroke="#fb651e"/>
    <text x="904" y="250" font-size="15" font-weight="700" fill="#fff">4 · CHECK LOOP</text>
    <text x="904" y="269" font-size="12" fill="#fff" fill-opacity=".75">lint · URLs · dryRun → back to Claude</text>
    <path d="M900 226 C880 200 760 200 740 222" stroke="#fb651e" stroke-width="1.8" stroke-dasharray="5 4" fill="none" marker-end="url(#a)"/>
  </g>
</svg>
