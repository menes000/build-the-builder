<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 330" width="1200" height="330" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#16140f"/><stop offset="1" stop-color="#2a1a10"/></linearGradient>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#fb651e"/></marker>
    <marker id="w" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#ffffff" fill-opacity=".6"/></marker>
  </defs>
  <rect width="1200" height="330" rx="20" fill="url(#bg)"/>
  <text x="40" y="44" font-size="12" fill="#fb651e" letter-spacing="2.5" font-weight="700">THE AGENT THE BUILDER DESIGNED · 31 NODES · TURKISH</text>

  <!-- main lane -->
  <rect x="40" y="96" width="120" height="64" rx="32" fill="#ffffff"/>
  <text x="100" y="124" text-anchor="middle" font-size="14" font-weight="700" fill="#16140f">call</text>
  <text x="100" y="142" text-anchor="middle" font-size="10.5" fill="#16140f" fill-opacity=".7">customerNumber · now</text>
  <path d="M160 128 H186" stroke="#fff" stroke-opacity=".6" stroke-width="2" marker-end="url(#w)"/>

  <rect x="190" y="96" width="150" height="64" rx="10" fill="#16140f" stroke="#ffffff" stroke-opacity=".25"/>
  <text x="265" y="122" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">find the card</text>
  <text x="265" y="141" text-anchor="middle" font-size="11" fill="#fff" fill-opacity=".6">cards.list · pick one</text>
  <path d="M340 128 H366" stroke="#fff" stroke-opacity=".6" stroke-width="2" marker-end="url(#w)"/>

  <rect x="370" y="96" width="150" height="64" rx="10" fill="#16140f" stroke="#ffffff" stroke-opacity=".25"/>
  <text x="445" y="122" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">get the debt</text>
  <text x="445" y="141" text-anchor="middle" font-size="11" fill="#fff" fill-opacity=".6">cards.balance</text>
  <path d="M520 128 H546" stroke="#fff" stroke-opacity=".6" stroke-width="2" marker-end="url(#w)"/>

  <rect x="550" y="88" width="190" height="80" rx="10" fill="#fb651e" fill-opacity=".15" stroke="#fb651e"/>
  <text x="645" y="116" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">read it out </text>
  <text x="645" y="135" text-anchor="middle" font-size="11" fill="#fff" fill-opacity=".75">₺ $ € £ in Turkish words</text>
  <text x="645" y="152" text-anchor="middle" font-size="11" fill="#fff" fill-opacity=".75">due date from now · in code</text>
  <path d="M740 128 H766" stroke="#fff" stroke-opacity=".6" stroke-width="2" marker-end="url(#w)"/>
  <path d="M600 88 C600 66 290 66 280 92" stroke="#ffffff" stroke-opacity=".35" stroke-width="1.5" stroke-dasharray="4 4" fill="none" marker-end="url(#w)"/>
  <text x="440" y="68" text-anchor="middle" font-size="11" fill="#fff" fill-opacity=".55">another card?</text>

  <polygon points="820,82 866,128 820,174 774,128" fill="#fb651e"/>
  <text x="820" y="132" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">offer</text>

  <!-- branches -->
  <path d="M846 104 L900 72" stroke="#fff" stroke-opacity=".6" stroke-width="2" marker-end="url(#w)"/>
  <path d="M866 128 H900" stroke="#fff" stroke-opacity=".6" stroke-width="2" marker-end="url(#w)"/>
  <path d="M846 152 L900 184" stroke="#fff" stroke-opacity=".6" stroke-width="2" marker-end="url(#w)"/>

  <rect x="904" y="44" width="256" height="52" rx="10" fill="#16140f" stroke="#ffffff" stroke-opacity=".25"/>
  <text x="920" y="66" font-size="13.5" font-weight="700" fill="#fff">e-mail the statement</text>
  <text x="920" y="84" font-size="11" fill="#fff" fill-opacity=".6">registered address · after a clear yes</text>

  <rect x="904" y="104" width="256" height="52" rx="10" fill="#16140f" stroke="#ffffff" stroke-opacity=".25"/>
  <text x="920" y="126" font-size="13.5" font-weight="700" fill="#fff">move the statement week</text>
  <text x="920" y="144" font-size="11" fill="#fff" fill-opacity=".6">get → preview → change once</text>

  <rect x="904" y="164" width="256" height="52" rx="10" fill="#16140f" stroke="#ffffff" stroke-opacity=".25"/>
  <text x="920" y="186" font-size="13.5" font-weight="700" fill="#fff">back to the main menu</text>
  <text x="920" y="204" font-size="11" fill="#fff" fill-opacity=".6">16 endings, each with its own sentence</text>

  <!-- global band -->
  <rect x="40" y="240" width="1120" height="62" rx="12" fill="#fb651e" fill-opacity=".08" stroke="#fb651e" stroke-opacity=".7" stroke-dasharray="6 4"/>
  <text x="62" y="266" font-size="12" fill="#fb651e" letter-spacing="2" font-weight="700">FROM ANY STEP</text>
  <text x="62" y="288" font-size="13" fill="#fff" fill-opacity=".85">payment · dispute · wants a person · third party · not Turkish · silence · angry caller · tries used up · service error</text>
  <path d="M1010 271 H1040" stroke="#fb651e" stroke-width="2" marker-end="url(#a)"/>
  <rect x="1044" y="254" width="104" height="34" rx="17" fill="#fb651e"/>
  <text x="1096" y="276" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">agent</text>
</svg>
